<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活圏防災ライブボード</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e8ecf4;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:1rem;box-sizing:border-box}
  #clock{font-size:clamp(3rem,14vw,8rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  #date{font-size:clamp(1rem,3.5vw,1.5rem);color:#aeb8cc}
  h1{font-size:clamp(1.1rem,4vw,1.8rem);margin:.5rem 0 0}
  p{color:#aeb8cc;margin:0}
</style>
</head>
<body>
<main>
  <div id="date"></div>
  <div id="clock">--:--:--</div>
  <h1>生活圏防災ライブボード</h1>
  <p>公開準備中です。警報・天気・地震・通行止め・ライブカメラを、このURLで見られるようにしています。</p>
</main>
<script>
  function tick(){
    const n=new Date();
    const p=v=>String(v).padStart(2,'0');
    document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
    document.getElementById('date').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
  }
  tick(); setInterval(tick,1000);
</script>

</body>
</html>
