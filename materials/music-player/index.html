<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>音楽データプレイヤー</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: #060a18; color: #e8ecf8;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .view { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  .hidden { display: none !important; }
  h1 { font-size: 20px; letter-spacing: .18em; margin: 6px 0 2px; font-weight: 600; }
  .sub { font-size: 12px; color: #93a3c8; line-height: 1.8; margin-bottom: 18px; }
  .card {
    background: rgba(13, 20, 42, .78); border: 1px solid #2b3a63; border-radius: 14px;
    padding: 14px 16px; margin: 10px 0; display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(3px);
  }
  .card .grow { flex: 1; min-width: 0; }
  .card .ttl { font-size: 16px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 11px; color: #93a3c8; margin-top: 3px; line-height: 1.6; }
  .badge { font-size: 10px; border: 1px solid #4a5f96; color: #b9c8ee; border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 2px; }
  .badge.recipe { border-color: #8a6d2f; color: #ffd98a; }
  button {
    font: inherit; color: #e8ecf8; background: #1a2547; border: 1px solid #3a4f86;
    border-radius: 10px; padding: 9px 16px; cursor: pointer; letter-spacing: .08em;
  }
  button:active { background: #26366a; }
  button.del { background: transparent; border-color: #3a3450; color: #8b87a3; padding: 9px 11px; }
  .empty { color: #93a3c8; font-size: 13px; line-height: 2; padding: 26px 4px; }
  #playTitle { font-size: 22px; letter-spacing: .12em; margin: 10px 0 2px; }
  #playMeta { font-size: 12px; color: #93a3c8; margin-bottom: 8px; line-height: 1.7; }
  #bigPlay {
    display: block; margin: 34px auto 10px; width: 132px; height: 132px; border-radius: 50%;
    font-size: 44px; line-height: 1; padding: 0 0 6px 6px;
    background: radial-gradient(circle at 35% 30%, #2c447e, #131f3f 70%);
    border: 2px solid #5f7cc0; color: #eaf0ff;
    box-shadow: 0 0 34px rgba(110, 150, 255, .35), inset 0 0 22px rgba(140, 170, 255, .22);
  }
  #bigPlay.stop { padding: 0 0 6px 0; font-size: 36px; }
  #bigPlay:disabled { opacity: .45; box-shadow: none; }
  #playStatus { text-align: center; font-size: 12px; color: #93a3c8; min-height: 20px; letter-spacing: .1em; }
  .notice {
    background: rgba(58, 42, 16, .55); border: 1px solid #8a6d2f; color: #ffd98a;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.9; margin-top: 18px;
  }
  .recipeTable { font-size: 12px; color: #b9c8ee; line-height: 1.9; margin-top: 10px; word-break: break-all; }
  .foot { margin-top: 34px; font-size: 11px; color: #5f6f96; line-height: 1.9; }
  a { color: #9db8f2; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="view" id="viewList">
  <h1>音楽データプレイヤー</h1>
  <div class="sub">小さい曲データを受け取って鳴らすプレイヤーです。URL で届いた曲は、このブラウザの中に保存されます。</div>
  <div id="songList"></div>
  <div class="empty hidden" id="emptyMsg">まだ曲がありません。曲データの URL（#m= つき）を開くと、ここに貯まっていきます。</div>
  <div class="foot">
    曲データは Markdown や JSON で書けます（ステップ形式／Arcadia の生成レシピ）。<br>
    データはこのブラウザの localStorage にだけ保存され、どこにも送信されません。
  </div>
</div>

<div class="view hidden" id="viewPlay">
  <button id="backBtn">← 一覧へ</button>
  <div id="playTitle"></div>
  <div id="playMeta"></div>
  <button id="bigPlay">▶</button>
  <div id="playStatus"></div>
  <div id="recipeBox" class="hidden">
    <div class="notice">この曲は ArcadiaMusicForge の生成レシピです。レシピの再生は、生成エンジンの移植後に有効になります（レシピ自体は一覧に保存されています）。</div>
    <div class="recipeTable" id="recipeTable"></div>
  </div>
</div>

<script src="hp-music.js"></script>
<script>
"use strict";
const LS_KEY = "mp-library-v1";
const SAMPLES = [
  { id: "sample-canon", song: {"t":"CANON - PACHELBEL","bpm":96,"v":[[62,"square",.13,"g.......e.......c.......b.......9.......7.......9.......b.......c.......b.......9.......7.......5.......4.......5.......2......."],[62,"square",.045,"0...7...4...7...7...e...b...e...9...g...c...g...4...b...7...b...5...c...9...c...7...e...b...e..."],[38,"triangle",.22,"c.......7.......9.......4.......5.......c.......5.......7.......c.......7.......9.......4.......5.......c.......5.......7......."]],"d":""} },
  { id: "sample-sky-ascent", song: {"t":"SKY ASCENT","bpm":144,"v":[[69,"square",.16,"0.3.7.c.a.7.5.7.8...c...f...c87.a...e...h...e.5.0.2.3.7.c.7.3.0."],[57,"square",.05,"037c037c037c037c8cfc8cfc8cfc8cfcaehaaehaaehaaeha037c037c037c037c"],[45,"triangle",.22,"0.0.c.0.0.0.c.0.8.8.k.8.8.8.k.8.a.a.m.a.a.a.m.a.0.0.c.0.7.7.c.0."]],"d":"K.h.S.h.K.h.S.hhK.h.S.h.K.h.S.hhK.h.S.h.K.h.S.hhK.h.S.h.K.h.SSSS"} }
];
const DEL_KEY = "mp-deleted-samples";
const VOICE_COLORS = ["#ffd166", "#7bdff2", "#f7a6c4", "#b2f7a5", "#c3b2ff", "#ffb38a"];

let library = loadLibrary();
let current = null;      // {entry, song, player}
let visualQueue = [];    // {at, voice, type, midi, drum}
let curStep = 0, curTotal = 0;

function hashOf(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }

function loadLibrary() {
  let lib = [];
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) lib = JSON.parse(raw);
  } catch (e) {}
  let deleted = [];
  try { deleted = JSON.parse(localStorage.getItem(DEL_KEY) || "[]"); } catch (e) {}
  SAMPLES.forEach(function (s) {
    const text = JSON.stringify(s.song);
    const hid = hashOf(text);
    // 旧版の固定IDで入っている同じサンプルは、内容ハッシュのIDへ寄せる（二重登録の解消）
    const oldIdx = lib.findIndex(e => e.id === s.id);
    if (oldIdx >= 0) {
      if (lib.some(e => e.id === hid)) lib.splice(oldIdx, 1);
      else lib[oldIdx].id = hid;
    }
    const isDeleted = deleted.indexOf(s.id) >= 0 || deleted.indexOf(hid) >= 0;
    if (!lib.some(e => e.id === hid) && !isDeleted) {
      lib.push({ id: hid, title: s.song.t, kind: "step", text: text, added: 0, sample: true });
    }
  });
  try { localStorage.setItem(LS_KEY, JSON.stringify(lib)); } catch (e) {}
  return lib;
}
function saveLibrary() { try { localStorage.setItem(LS_KEY, JSON.stringify(library)); } catch (e) {} }

function addToLibrary(text, song) {
  const id = hashOf(text);
  if (library.some(e => e.id === id)) return library.find(e => e.id === id);
  const entry = { id: id, title: song.title, kind: song.kind, text: text, added: Date.now() };
  library.unshift(entry);
  saveLibrary();
  return entry;
}

function metaOf(entry, song) {
  if (!song) { try { song = HPMusic.parse(entry.text); } catch (e) { return "読み込めませんでした"; } }
  if (song.kind === "recipe") {
    const r = song.recipe || {};
    return "レシピ" + (r.genre ? " ／ " + r.genre : "") + (r.style ? " ／ " + r.style : "") + (r.seed != null ? " ／ seed " + r.seed : "");
  }
  const secs = (HPMusic.totalSteps(song) * 60 / song.bpm / 4).toFixed(1);
  return "BPM " + song.bpm + " ／ " + HPMusic.totalSteps(song) + "ステップ（約" + secs + "秒でループ）";
}

function renderList() {
  const box = document.getElementById("songList");
  box.innerHTML = "";
  document.getElementById("emptyMsg").classList.toggle("hidden", library.length > 0);
  library.forEach(function (entry) {
    let song = null;
    try { song = HPMusic.parse(entry.text); } catch (e) {}
    const card = document.createElement("div");
    card.className = "card";
    const grow = document.createElement("div");
    grow.className = "grow";
    const ttl = document.createElement("div");
    ttl.className = "ttl";
    ttl.textContent = entry.title;
    const badge = document.createElement("span");
    badge.className = "badge" + (entry.kind === "recipe" ? " recipe" : "");
    badge.textContent = entry.kind === "recipe" ? "レシピ" : "ステップ";
    ttl.appendChild(badge);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = metaOf(entry, song) + (entry.sample ? " ／ サンプル" : (entry.added ? " ／ " + new Date(entry.added).toLocaleDateString("ja-JP") : ""));
    grow.appendChild(ttl); grow.appendChild(meta);
    const play = document.createElement("button");
    play.textContent = "再生";
    play.onclick = () => openPlay(entry);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "削除";
    del.onclick = () => {
      library = library.filter(e => e.id !== entry.id);
      if (entry.sample) {
        try {
          const deleted = JSON.parse(localStorage.getItem(DEL_KEY) || "[]");
          if (deleted.indexOf(entry.id) < 0) { deleted.push(entry.id); localStorage.setItem(DEL_KEY, JSON.stringify(deleted)); }
        } catch (e) {}
      }
      saveLibrary(); renderList();
    };
    card.appendChild(grow); card.appendChild(play); card.appendChild(del);
    box.appendChild(card);
  });
}

/* ---------------- 再生画面 ---------------- */

function show(view) {
  document.getElementById("viewList").classList.toggle("hidden", view !== "list");
  document.getElementById("viewPlay").classList.toggle("hidden", view !== "play");
}

function openPlay(entry) {
  stopCurrent();
  let song;
  try { song = HPMusic.parse(entry.text); }
  catch (e) {
    document.getElementById("playTitle").textContent = entry.title;
    document.getElementById("playMeta").textContent = "データを読み込めませんでした: " + e.message;
    document.getElementById("bigPlay").disabled = true;
    document.getElementById("recipeBox").classList.add("hidden");
    show("play");
    return;
  }
  current = { entry: entry, song: song, player: null };
  document.getElementById("playTitle").textContent = song.title;
  document.getElementById("playMeta").textContent = metaOf(entry, song);
  const big = document.getElementById("bigPlay");
  const status = document.getElementById("playStatus");
  visualQueue = []; curStep = 0;
  if (song.kind === "recipe") {
    big.disabled = true;
    status.textContent = "";
    const tbl = document.getElementById("recipeTable");
    tbl.innerHTML = "";
    Object.keys(song.recipe || {}).forEach(function (k) {
      const div = document.createElement("div");
      div.textContent = k + ": " + song.recipe[k];
      tbl.appendChild(div);
    });
    document.getElementById("recipeBox").classList.remove("hidden");
  } else {
    big.disabled = false;
    document.getElementById("recipeBox").classList.add("hidden");
    status.textContent = "タップで再生";
    curTotal = HPMusic.totalSteps(song);
    current.player = HPMusic.createPlayer(song, {
      onStep: function (s, events, when) {
        curStep = s;
        events.forEach(function (ev) { visualQueue.push({ at: when, voice: ev.voice, type: ev.type, midi: ev.midi, drum: ev.drum }); });
      },
      onPlay: function () { big.textContent = "■"; big.classList.add("stop"); status.textContent = "再生中（タップで停止）"; },
      onStop: function () { big.textContent = "▶"; big.classList.remove("stop"); status.textContent = "タップで再生"; }
    });
  }
  show("play");
}

function stopCurrent() {
  if (current && current.player) current.player.stop();
  current = current ? { entry: current.entry, song: current.song, player: null } : null;
  visualQueue = [];
}

document.getElementById("bigPlay").onclick = function () {
  if (!current || !current.player) return;
  if (current.player.playing) current.player.stop();
  else current.player.play();
};
document.getElementById("backBtn").onclick = function () {
  stopCurrent();
  renderList();
  show("list");
};

/* ---------------- #m= の受け取り ---------------- */

async function decodePayload(b64) {
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try {
    const ds = new DecompressionStream("gzip");
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(buf);
  } catch (e) {
    return new TextDecoder().decode(bytes);
  }
}

async function handleHash() {
  const m = location.hash.match(/#m=([A-Za-z0-9\-_]+)/);
  if (!m) { renderList(); show("list"); return; }
  try {
    const text = await decodePayload(m[1]);
    const song = HPMusic.parse(text);
    const entry = addToLibrary(text.trim(), song);
    openPlay(entry);
  } catch (e) {
    renderList(); show("list");
    document.getElementById("emptyMsg").classList.remove("hidden");
    document.getElementById("emptyMsg").textContent = "曲データを読み込めませんでした: " + e.message;
  }
}

/* ---------------- 星空の場面 ---------------- */

const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let stars = [], blooms = [], flashes = [];
const activeGlow = {}; // voice -> {midi, since}
function resize() {
  cv.width = innerWidth * devicePixelRatio;
  cv.height = innerHeight * devicePixelRatio;
  stars = [];
  const n = Math.floor(innerWidth * innerHeight / 9000);
  for (let i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random() * 0.82, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28 });
}
addEventListener("resize", resize);
resize();

function midiY(midi) {
  const t = Math.max(0, Math.min(1, (midi - 30) / 62));
  return (1 - t) * 0.78 + 0.06;
}

function draw(now) {
  const W = cv.width, H = cv.height, dpr = devicePixelRatio;
  const grad = cx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#04061a");
  grad.addColorStop(0.75, "#081026");
  grad.addColorStop(1, "#0d1834");
  cx.fillStyle = grad;
  cx.fillRect(0, 0, W, H);
  // 星
  stars.forEach(function (s) {
    const a = 0.35 + 0.3 * Math.sin(now / 900 + s.p);
    cx.globalAlpha = a;
    cx.fillStyle = "#cfe0ff";
    cx.beginPath(); cx.arc(s.x * W, s.y * H, s.r * dpr, 0, 6.29); cx.fill();
  });
  cx.globalAlpha = 1;
  // 地平の光（進み具合）
  const hy = H * 0.9;
  const hg = cx.createLinearGradient(0, hy - 30 * dpr, 0, hy);
  hg.addColorStop(0, "rgba(90,130,220,0)");
  hg.addColorStop(1, "rgba(90,130,220,0.20)");
  cx.fillStyle = hg;
  cx.fillRect(0, hy - 30 * dpr, W, 30 * dpr);
  if (curTotal > 0) {
    cx.fillStyle = "rgba(150,190,255,0.75)";
    cx.fillRect(0, hy - 2 * dpr, W * (curStep / curTotal), 2 * dpr);
  }
  // 音の光（持続）
  Object.keys(activeGlow).forEach(function (v) {
    const g = activeGlow[v];
    const x = W * (0.5 + (Number(v) - 1) * 0.16) + Math.sin(g.midi) * W * 0.03;
    const y = H * midiY(g.midi);
    const r = 46 * dpr * (1 + 0.05 * Math.sin(now / 300 + Number(v)));
    const rg = cx.createRadialGradient(x, y, 0, x, y, r);
    const c = VOICE_COLORS[Number(v) % VOICE_COLORS.length];
    rg.addColorStop(0, c + "55");
    rg.addColorStop(1, c + "00");
    cx.fillStyle = rg;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.29); cx.fill();
  });
  // 咲く光
  blooms = blooms.filter(b => now - b.born < 900);
  blooms.forEach(function (b) {
    const age = (now - b.born) / 900;
    const x = b.x * W, y = b.y * H;
    const r = (8 + age * 54) * dpr;
    cx.globalAlpha = (1 - age) * 0.9;
    cx.strokeStyle = b.color;
    cx.lineWidth = 2 * dpr;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.29); cx.stroke();
    cx.globalAlpha = (1 - age) * 0.5;
    cx.beginPath(); cx.arc(x, y, r * 0.55, 0, 6.29); cx.stroke();
    cx.globalAlpha = 1;
    cx.fillStyle = b.color;
    cx.beginPath(); cx.arc(x, y, 3 * dpr * (1 - age) + 1, 0, 6.29); cx.fill();
  });
  // ドラムの明滅
  flashes = flashes.filter(f => now - f.born < 260);
  flashes.forEach(function (f) {
    const age = (now - f.born) / 260;
    cx.fillStyle = "rgba(255,230,170," + (0.20 * (1 - age)) + ")";
    cx.fillRect(0, H * 0.86, W, H * 0.14);
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// 再生に合わせて映像キューを消費する
setInterval(function () {
  if (!current || !current.player || !current.player.playing) return;
  const nowA = current.player.audioTime;
  while (visualQueue.length && visualQueue[0].at <= nowA + 0.03) {
    const ev = visualQueue.shift();
    if (ev.type === "on") {
      activeGlow[ev.voice] = { midi: ev.midi, since: performance.now() };
      blooms.push({
        x: 0.5 + (ev.voice - 1) * 0.16 + Math.sin(ev.midi * 3.7) * 0.03,
        y: midiY(ev.midi),
        color: VOICE_COLORS[ev.voice % VOICE_COLORS.length],
        born: performance.now()
      });
    } else if (ev.type === "off") {
      delete activeGlow[ev.voice];
    } else if (ev.type === "drum") {
      flashes.push({ born: performance.now() });
    }
  }
}, 30);

addEventListener("hashchange", handleHash);

window.__mpState = function () {
  return {
    view: document.getElementById("viewPlay").classList.contains("hidden") ? "list" : "play",
    playing: !!(current && current.player && current.player.playing),
    step: curStep, total: curTotal, lib: library.length
  };
};

handleHash();
</script>
</body>
</html>
