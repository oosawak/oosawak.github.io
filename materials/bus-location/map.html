<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS ログの地図表示 ― バス位置情報</title>
<meta name="description" content="保存した GPS ログを OpenStreetMap の上に表示する試作ページ。軌跡と時刻つきの点、再生表示ができます。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--cream:#faf6ec;--paper:#fffdf6;--ink:#2f3330;--muted:#6b6f66;--olive:#6d7c4f;--olive-dark:#4c5a36;--terra:#c96f4a;--line:#e3dcc8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 56px}
  header{padding:36px 0 6px}
  h1{font-size:25px;margin:6px 0}
  .lead{color:var(--muted);margin:0 0 14px}
  #map{height:480px;border-radius:12px;border:1px solid var(--line)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
  button{background:var(--olive);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:15px;cursor:pointer}
  button:hover{background:var(--olive-dark)}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
  .note{color:var(--muted);font-size:13px;margin-top:16px}
  a{color:var(--olive-dark)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>GPS ログの地図表示</h1>
  <p class="lead">保存した GPS ログを、OpenStreetMap の上に表示する試作です。点を押すと、その地点の時刻が出ます。「再生」で、バスが走った順にたどれます。</p>
</header>

<div id="map"></div>
<div class="bar">
  <button id="play" type="button">再生</button>
  <span class="stat" id="summary">読み込み中…</span>
  <span class="stat" id="now">—</span>
</div>

<p class="note">表示しているのは、表示確認用のサンプルデータ（東根市周辺を回る架空の路線、41点）です。実際のロガーでは、Hako@Linux の GPS ログ（時刻つきの緯度・経度の一覧）をこの形式で置けば、そのまま表示できます。地図は OpenStreetMap、表示は Leaflet を使っています。</p>
<p><a href="./">バス位置情報のページへ戻る</a></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var map = L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  fetch('track-sample.json').then(function(r){ return r.json(); }).then(function(data){
    var pts = data.points;
    var latlngs = pts.map(function(p){ return [p.lat, p.lon]; });
    var line = L.polyline(latlngs, {color: '#c96f4a', weight: 4}).addTo(map);
    map.fitBounds(line.getBounds(), {padding: [20, 20]});

    pts.forEach(function(p, i){
      var m = L.circleMarker([p.lat, p.lon], {radius: 4, color: '#4c5a36', fillColor: '#6d7c4f', fillOpacity: 0.9}).addTo(map);
      m.bindPopup((i + 1) + ' 点目<br>' + p.time + ' / ' + p.speed_kmh + ' km/h');
    });
    L.marker(latlngs[0]).addTo(map).bindPopup('出発 ' + pts[0].time);
    L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup('到着 ' + pts[pts.length - 1].time);

    var total = 0;
    for (var i = 1; i < latlngs.length; i++) total += map.distance(latlngs[i - 1], latlngs[i]);
    document.getElementById('summary').textContent =
      data.name + ' / ' + pts.length + ' 点 / 約 ' + (total / 1000).toFixed(1) + ' km / ' + pts[0].time + '〜' + pts[pts.length - 1].time;

    var bus = L.circleMarker(latlngs[0], {radius: 9, color: '#fff', weight: 2, fillColor: '#c96f4a', fillOpacity: 1});
    var idx = 0, timer = null;
    var btn = document.getElementById('play');
    btn.addEventListener('click', function(){
      if (timer) { clearInterval(timer); timer = null; btn.textContent = '再生'; return; }
      bus.addTo(map); idx = 0; btn.textContent = '止める';
      timer = setInterval(function(){
        var p = pts[idx];
        bus.setLatLng([p.lat, p.lon]);
        document.getElementById('now').textContent = (idx + 1) + ' 点目 ' + p.time + ' / ' + p.speed_kmh + ' km/h';
        idx++;
        if (idx >= pts.length) { clearInterval(timer); timer = null; btn.textContent = '再生'; }
      }, 400);
    });
  });
})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "cdf4ee53507948e4a412f503875833cd"}'></script>
</body>
</html>
