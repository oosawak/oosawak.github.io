<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hako ナビ（試作）― 箱のカーナビ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--ink:#EDEBE3;--muted:#A9A697;--olive:#8FA35C;--terra:#D97B4A;--panel:#26281F;--panel2:#30331F;--line:#3E4132}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#101110;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{width:min(100vw,141.4vh);aspect-ratio:297/210;background:#1B1C17;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{font-weight:800;font-size:17px;white-space:nowrap}
  .logo small{color:var(--muted);font-weight:600;font-size:11.5px;margin-left:6px}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tabs button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:7px 20px;font-size:15px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
  .pill{font-size:12.5px;background:#17181a;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}
  .pill b{color:var(--olive)}
  .clock{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  main{flex:1;position:relative;min-height:0}
  .pane{position:absolute;inset:0;display:none}
  .pane.on{display:flex}
  /* map pane */
  #map{flex:1;min-width:0;background:#222}
  .side{width:236px;background:var(--panel);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
  .speed{text-align:center}
  .speed .num{font-size:74px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .speed .unit{color:var(--muted);font-size:14px}
  .kv{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
  .kv b{font-variant-numeric:tabular-nums}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:11px 10px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .btn.rec{background:var(--terra);border-color:var(--terra);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .note{font-size:12px;color:var(--muted);line-height:1.6}
  /* media panes */
  .media{flex-direction:column;padding:14px;gap:10px;background:#14150f}
  .media .frame{flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;position:relative}
  .media iframe{width:100%;height:100%;border:0;display:block}
  .media .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .media input{flex:1;min-width:220px;background:#1d1f19;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font-size:14px}
  .media .bar .btn{width:auto;padding:10px 18px}
  .media a.open{background:var(--olive);color:#101110;text-decoration:none;border-radius:9px;padding:10px 18px;font-weight:800;font-size:14.5px}
  .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
    font-size:15px;text-align:center;padding:20px;line-height:1.9}
  @media (max-width:760px){ .side{width:180px} .speed .num{font-size:52px} .logo small{display:none} }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="logo">Hako ナビ<small>試作・一枚 HTML</small></div>
    <nav class="tabs">
      <button id="tab-map" class="on" onclick="showTab('map')">地図</button>
      <button id="tab-music" onclick="showTab('music')">音楽</button>
      <button id="tab-video" onclick="showTab('video')">動画</button>
    </nav>
    <div class="head-right">
      <span class="pill">接続: <b id="src">探しています</b></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>
  <main>
    <!-- 地図 -->
    <section class="pane on" id="pane-map">
      <div id="map"></div>
      <aside class="side">
        <div class="speed"><span class="num" id="speed">0</span><div class="unit">km/h</div></div>
        <div class="kv"><span>高度</span><b id="alt">― m</b></div>
        <div class="kv"><span>気圧</span><b id="pres">― hPa</b></div>
        <div class="kv"><span>記録</span><b id="reccount">0 件</b></div>
        <div class="kv"><span>未送信（スプール）</span><b id="spool">0 件</b></div>
        <button class="btn" id="recbtn" onclick="toggleRec()">● 記録をはじめる</button>
        <button class="btn" id="sendbtn" onclick="sendSpool()" disabled>送信する（CSV で保存）</button>
        <button class="btn" onclick="startDemo()">デモ再生（昨日の帰り道）</button>
        <p class="note">位置は、箱の橋（127.0.0.1:54646）→ この端末の GPS の順に探します。どちらも無い時はデモ再生で動きを見られます。記録はこの画面の中に貯めて、送信で CSV に出します。</p>
      </aside>
    </section>
    <!-- 音楽 -->
    <section class="pane media" id="pane-music">
      <div class="frame">
        <div class="placeholder" id="music-ph">Apple Music の共有リンクを下に貼ると、ここで流れます。<br>本物のページで開くこともできます。</div>
        <iframe id="music-frame" allow="autoplay *; encrypted-media *;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" style="display:none"></iframe>
      </div>
      <div class="bar">
        <input id="music-url" type="url" placeholder="Apple Music の共有リンク（https://music.apple.com/jp/album/…）">
        <button class="btn" onclick="loadMusic()">読み込む</button>
        <a class="open" href="https://music.apple.com/jp/" target="_blank" rel="noopener">Apple Music を開く</a>
      </div>
    </section>
    <!-- 動画 -->
    <section class="pane media" id="pane-video">
      <div class="frame">
        <iframe id="video-frame" src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="bar">
        <input id="video-url" type="url" placeholder="YouTube の URL（https://www.youtube.com/watch?v=…）">
        <button class="btn" onclick="loadVideo()">読み込む</button>
        <a class="open" href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube を開く</a>
      </div>
    </section>
  </main>
</div>

let map, marker, line, follow = true;
let recording = false, rec = [], spool = 0, demoTimer = null, source = "";

function showTab(name){
  for (const n of ["map","music","video"]){
    document.getElementById("pane-"+n).classList.toggle("on", n===name);
    document.getElementById("tab-"+n).classList.toggle("on", n===name);
  }
  if (name==="map" && map) setTimeout(()=>map.invalidateSize(), 60);
}
function setSrc(s){ source = s; document.getElementById("src").textContent = s; }
function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
setInterval(tickClock, 1000); tickClock();

function initMap(){
  map = L.map("map", {zoomControl:false}).setView([38.26, 140.87], 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom: 19, attribution: "© OpenStreetMap contributors"}).addTo(map);
  L.control.zoom({position:"bottomleft"}).addTo(map);
  marker = L.circleMarker([38.26, 140.87], {radius:11, color:"#fff", weight:3, fillColor:"#D97B4A", fillOpacity:1}).addTo(map);
  line = L.polyline([], {color:"#D97B4A", weight:5, opacity:.85}).addTo(map);
  map.on("dragstart", ()=> follow = false);
}
initMap();

function updatePos(lat, lon, spdKmh, alt, pres){
  marker.setLatLng([lat, lon]);
  if (follow) map.setView([lat, lon], Math.max(map.getZoom(), 14));
  document.getElementById("speed").textContent = spdKmh==null ? "0" : Math.round(spdKmh);
  if (alt!=null) document.getElementById("alt").textContent = Math.round(alt)+" m";
  if (pres!=null) document.getElementById("pres").textContent = pres.toFixed(1)+" hPa";
  if (recording){
    rec.push({t:new Date().toISOString(), lat, lon, spd: spdKmh==null?0:Math.round(spdKmh)});
    spool++;
    line.addLatLng([lat, lon]);
    document.getElementById("reccount").textContent = rec.length+" 件";
    document.getElementById("spool").textContent = spool+" 件";
    document.getElementById("sendbtn").disabled = spool===0;
  }
}

/* 1) 箱の橋を 2 秒ごとに探す */
async function pollBridge(){
  try{
    const r = await fetch("http://127.0.0.1:54646/v1/location", {signal: AbortSignal.timeout(1200)});
    if (!r.ok) throw 0;
    const j = await r.json();
    const lat = j.lat ?? j.latitude, lon = j.lon ?? j.lng ?? j.longitude;
    if (lat==null || lon==null) throw 0;
    setSrc("箱の橋");
    updatePos(lat, lon, j.spd ?? (j.speed!=null? j.speed*3.6 : null), j.alt ?? j.altitude, j.pressure);
  }catch(e){
    if (source==="箱の橋") setSrc("探しています");
  }
}
setInterval(pollBridge, 2000); pollBridge();

    if (source==="箱の橋" || demoTimer) return;
    setSrc("この端末の GPS");
    updatePos(p.coords.latitude, p.coords.longitude,
      p.coords.speed!=null? p.coords.speed*3.6 : null, p.coords.altitude, null);
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:2000});
}

/* 3) デモ再生 */
function startDemo(){
  if (demoTimer){ clearInterval(demoTimer); demoTimer = null; }
  setSrc("デモ再生");
  let i = 0;
  demoTimer = setInterval(()=>{
    if (i >= DEMO.length){ clearInterval(demoTimer); demoTimer = null; setSrc("デモ終了"); return; }
    const [lat, lon, spd] = DEMO[i++];
    updatePos(lat, lon, spd, null, null);
  }, 120);
}

function toggleRec(){
  recording = !recording;
  const b = document.getElementById("recbtn");
  b.textContent = recording ? "■ 記録を止める" : "● 記録をはじめる";
  b.classList.toggle("rec", recording);
}
function sendSpool(){
  if (!rec.length) return;
  const csv = "time,lat,lon,speed_kmh\n" + rec.map(r=>[r.t, r.lat, r.lon, r.spd].join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "hako-navi-track.csv"; a.click();
  URL.revokeObjectURL(a.href);
  spool = 0;
  document.getElementById("spool").textContent = "0 件";
  document.getElementById("sendbtn").disabled = true;
}

function loadMusic(){
  const v = document.getElementById("music-url").value.trim();
  if (!v) return;
  const f = document.getElementById("music-frame");
  f.src = v.replace("https://music.apple.com/", "https://embed.music.apple.com/");
  f.style.display = "block";
  document.getElementById("music-ph").style.display = "none";
}
function loadVideo(){
  const v = document.getElementById("video-url").value.trim();
  const m = v.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{6,})/);
  if (!m) return;
  document.getElementById("video-frame").src = "https://www.youtube-nocookie.com/embed/" + m[1];
}

if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{});
