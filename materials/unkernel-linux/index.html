<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux (unkernel) — Sprite Stack Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #101216; color: #d7dce2;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  #bar { padding: 8px 12px; font-size: 13px; background: #171a1f;
    border-bottom: 1px solid #262b33; display: flex; gap: 12px; align-items: baseline; }
  #status { color: #9fd48a; }
  #term { margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-all;
    font-size: 13px; line-height: 1.45; height: calc(100% - 41px); overflow-y: auto;
    outline: none; cursor: text; }
</style>
</head>
<body>
<div id="bar"><strong>Linux in Wallpaper (unkernel)</strong><span id="status">起動準備中…</span></div>
<pre id="term" tabindex="0"></pre>
<script type="module">
import { createKernel, checkSupport } from "./unkernel/web.mjs";

const term = document.getElementById("term");
const status = document.getElementById("status");
const decoder = new TextDecoder("utf-8", { fatal: false });
// 最小限のANSI除去（本格的な端末は後でxterm等に置き換える）
const stripAnsi = (s) => s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").replace(/\x1b\][^\x07]*\x07/g, "");
function out(text) {
  term.textContent += stripAnsi(text);
  term.scrollTop = term.scrollHeight;
}

let vm = null;
async function boot() {
  const support = await checkSupport().catch((e) => ({ ok: false, reason: String(e) }));
  if (support && support.ok === false) {
    status.textContent = "この環境では未対応です";
    out("サポートチェック: " + JSON.stringify(support) + "\n");
    out("（JSPI = WebAssembly.Suspending が必要です。Chrome/Edge 137以降で動作します）\n");
    return;
  }
  status.textContent = "起動中…";
  try {
    vm = await createKernel();
    vm.onOutput((bytes) => out(decoder.decode(bytes, { stream: true })));
    status.textContent = "起動しました（この画面をクリックして入力）";
    term.focus();
    if (location.hash.includes("autotest")) {
      setTimeout(() => vm && vm.write("uname -a; cat /etc/os-release | head -3\n"), 5000);
    }
  } catch (e) {
    status.textContent = "起動に失敗しました";
    out("エラー: " + (e && e.stack ? e.stack : String(e)) + "\n");
  }
}

term.addEventListener("keydown", (ev) => {
  if (!vm) return;
  let s = null;
  if (ev.key === "Enter") s = "\r";
  else if (ev.key === "Backspace") s = "\x7f";
  else if (ev.key === "Tab") s = "\t";
  else if (ev.key === "Escape") s = "\x1b";
  else if (ev.key === "ArrowUp") s = "\x1b[A";
  else if (ev.key === "ArrowDown") s = "\x1b[B";
  else if (ev.key === "ArrowRight") s = "\x1b[C";
  else if (ev.key === "ArrowLeft") s = "\x1b[D";
  else if (ev.ctrlKey && ev.key.length === 1) s = String.fromCharCode(ev.key.toUpperCase().charCodeAt(0) - 64);
  else if (ev.key.length === 1) s = ev.key;
  if (s !== null) { ev.preventDefault(); vm.write(s); }
});
term.addEventListener("paste", (ev) => {
  if (!vm) return;
  const text = (ev.clipboardData || window.clipboardData).getData("text");
  if (text) { ev.preventDefault(); vm.write(text.replace(/\n/g, "\r")); }
});

boot();
</script>
</body>
</html>
